name: CI

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The book has no executable code chunks, so Quarto uses the markdown
      # engine and this needs no R and no bmm. tinytex is for the scrreprt PDF.
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Render the book
        run: quarto render

      # Until this workflow has rendered green at least once, _book/ is still
      # committed, so a failed render would otherwise push the stale committed
      # copy and look like a success. Fail loudly instead.
      - name: Verify the render produced a book
        run: |
          test -f _book/index.html || { echo "::error::_book/index.html missing after render"; exit 1; }
          test -f _book/BMM-Developer-Notes.pdf || { echo "::error::PDF missing after render"; exit 1; }
          for f in index setup git-workflow bmm-architecture example-model add-new-model coding-conventions; do
            test -f "_book/$f.html" || { echo "::error::_book/$f.html missing after render"; exit 1; }
          done

      - name: Pushes to another repository
        uses: cpina/github-action-push-to-another-repository@main
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        with:
          source-directory: '_book'
          destination-github-username: 'popov-lab'
          destination-repository-name: 'bmm'
          user-email: github-actions[bot]@users.noreply.github.com
          target-branch: gh-pages
          target-directory: dev/dev-notes
      - name: Pushes to another repository (2)
        uses: cpina/github-action-push-to-another-repository@main
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        with:
          source-directory: '_book'
          destination-github-username: 'popov-lab'
          destination-repository-name: 'bmm'
          user-email: github-actions[bot]@users.noreply.github.com
          target-branch: gh-pages
          target-directory: dev-notes
